[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalcode"
version = "0.1.0"
description = "Iterative code-generation agent: RAG + LangGraph with a Gemini free-tier model, sandboxed tests, and a bounded retry loop."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "langchain-openai",
    "langchain-huggingface",
    "sentence-transformers",
    "openai",
    "chromadb",
    "python-dotenv",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
corpus = [
    "pandas",
    "numpy",
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalcode"]

[tool.ruff]
line-length = 100
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: real Gemini calls (needs GEMINI_API_KEY; consumes free quota)",
    "slow: downloads the real embedding model",
]
addopts = "-m 'not live and not slow'"
